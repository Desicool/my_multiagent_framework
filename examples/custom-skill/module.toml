[module]
name = "custom-skill"
version = "1.0.0"
description = "Example skill demonstrating gate and eval modules"

# Gate: block dangerous tool calls
[hooks.validate_tool_call]
handlers = ["gate.security_check"]
mode = "first_block_wins"

# Gate: inspect tool results
[hooks.validate_tool_result]
handlers = ["gate.result_inspector"]
mode = "all_must_pass"

# Gate: filter agent output
[hooks.filter_output]
handlers = ["gate.output_guard"]
mode = "all_must_pass"

# Eval: record baseline at spawn
[hooks.before_agent_start]
handlers = ["eval.baseline_recorder"]
mode = "all_run"

# Eval: score each turn
[hooks.evaluate_turn]
handlers = ["eval.quality_scorer"]
mode = "all_run"

# Eval: collect metrics on tool results and cost
[hooks.on_event]
handlers = ["eval.metrics_collector"]
events = ["tool_result", "run.cost"]
mode = "all_run"
