[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beidou"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.55.0",
    "claude-agent-sdk>=0.1.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "aiofiles>=23.0.0",
    "pydantic>=2.0.0",
    "httpx[socks]>=0.24.0",
    "PyYAML>=6.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
tui = ["textual>=0.60.0"]

[tool.setuptools.package-data]
beidou = ["web/static/*", "web/static/assets/*", "skills/**/SKILL.md"]

[project.scripts]
beidou = "beidou.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["beidou*"]
