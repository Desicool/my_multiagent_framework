<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beidou</title>

  <link rel="stylesheet" href="/vis-timeline.min.css" />
  <link rel="stylesheet" href="/styles.css" />

  <script src="/tailwindcss.js"></script>
  <script>
    tailwind.config = { corePlugins: { preflight: false } };
  </script>
  <!-- app.js must execute before Alpine so Alpine.data("app") is registered before alpine:init fires -->
  <script defer src="/app.js"></script>
  <script defer src="/alpinejs.min.js"></script>
  <script defer src="/vis-timeline.min.js"></script>
</head>

<body class="bg-0 fg-0">
  <div x-data="app" x-init="init()" x-cloak>
    <!-- Top bar -->
    <header class="sticky top-0 z-30 flex items-center justify-between px-4 py-2"
            style="background: var(--bg-0); border-bottom: 1px solid var(--border);">
      <div class="flex items-center gap-3">
        <a href="#/" class="mono font-semibold text-sm brand" aria-label="Beidou home">北斗 Beidou</a>
        <nav class="flex items-center gap-1 text-[11px] fg-2 mono" x-show="breadcrumb.length">
          <template x-for="(crumb, i) in breadcrumb" :key="i">
            <span class="flex items-center gap-1">
              <span class="fg-2">/</span>
              <a :href="crumb.href" class="fg-1 hover:fg-0" x-text="crumb.label"></a>
            </span>
          </template>
        </nav>
      </div>
      <div class="flex items-center gap-3">
        <span class="drawer-toggles" x-show="routeName === 'task'">
          <button class="btn" @click="drawerLeft = !drawerLeft" aria-label="Toggle team tree">◧ Teams</button>
          <button class="btn" @click="drawerRight = !drawerRight" aria-label="Toggle event stream">Events ◨</button>
        </span>
        <span class="flex items-center gap-1 text-[11px] fg-1 mono" aria-live="polite">
          <span class="dot"
                :class="liveOK ? 'running pulse' : 'failed'"
                aria-hidden="true"></span>
          <span x-text="liveOK ? 'live' : 'offline'"></span>
        </span>
      </div>
    </header>

    <main class="px-4 py-4">
      <!-- Dashboard -->
      <template x-if="routeName === 'home'">
        <section x-html="renderHome()"></section>
      </template>

      <!-- Persistent timeline mount — lives outside x-html so vis.js survives re-renders -->
      <section class="panel mb-3" x-show="routeName === 'task' && task" x-cloak>
        <button class="w-full flex items-center justify-between px-3 py-2 text-[11px] mono fg-1"
                @click="timelineOpen = !timelineOpen; $nextTick(() => drawTimeline())"
                :aria-expanded="timelineOpen">
          <span>Timeline</span>
          <span x-text="timelineOpen ? '▾' : '▸'"></span>
        </button>
        <div x-show="timelineOpen" id="beidou-timeline" style="height: 120px;"></div>
      </section>

      <!-- Task detail -->
      <template x-if="routeName === 'task'">
        <section x-html="renderTask()"></section>
      </template>

      <!-- Agent detail -->
      <template x-if="routeName === 'agent'">
        <section x-html="renderAgent()"></section>
      </template>

      <!-- 404 / unknown -->
      <template x-if="routeName === 'unknown'">
        <section class="panel p-4 fg-1">
          <p>Unknown route. <a class="fg-0 underline" href="#/">Go home.</a></p>
        </section>
      </template>
    </main>
  <!-- Question modal -->
  <template x-if="activeQuestion">
    <div class="fixed inset-0 z-50 flex items-center justify-center"
         style="background: rgba(0,0,0,0.7);">
      <div class="panel mono" style="width: 560px; max-width: 95vw; padding: 24px;">
        <div class="fg-2 text-[11px] mb-1">
          Question from <span x-text="activeQuestion.asker_agent_id" class="fg-1"></span>
          <span class="fg-2" x-show="activeQuestion.chain && activeQuestion.chain.length > 1">
            — chain: <span x-text="(activeQuestion.chain || []).join(' → ')"></span>
          </span>
        </div>
        <p class="fg-0 mb-3 text-[13px]" x-text="activeQuestion.prompt"></p>
        <p class="fg-2 text-[11px] mb-3" x-show="activeQuestion.context_hint"
           x-text="'context: ' + activeQuestion.context_hint"></p>
        <textarea class="mono text-[12px] w-full rounded"
                  style="background: var(--bg-1); border: 1px solid var(--border); padding: 8px; color: var(--fg-0); resize: vertical;"
                  rows="4"
                  x-model="questionAnswer"
                  placeholder="Type your answer…"
                  @keydown.meta.enter="submitAnswer()"
                  @keydown.ctrl.enter="submitAnswer()"></textarea>
        <div class="flex gap-2 mt-3">
          <button class="btn" @click="submitAnswer()"
                  style="background: #7c3aed; color: white;">
            Submit answer
          </button>
          <button class="btn" @click="activeQuestion = null; questionAnswer = ''">
            Dismiss
          </button>
        </div>
        <div class="fg-2 text-[10px] mt-2">Cmd+Enter or Ctrl+Enter to submit</div>
      </div>
    </div>
  </template>
  </div>

  <style>[x-cloak] { display: none !important; }</style>
</body>
</html>
